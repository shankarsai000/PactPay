databases:
  - name: pactpay-postgres
    databaseName: pactpay_ledger
    user: pactpay_admin
    plan: basic-256mb
    region: oregon

services:
  # 1. Zero-Cold-Start FastAPI Production Backend ($7/mo covered by $50 Render Credit)
  - type: web
    name: pactpay-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: pactpay-postgres
          property: connectionString
      - key: PACTPAY_HMAC_SECRET
        generateValue: true
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com

  # 2. Zero-Cold-Start Next.js AG Grid Trading Floor ($7/mo covered by $50 Render Credit)
  - type: web
    name: pactpay-frontend
    env: node
    region: oregon
    plan: starter
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: pactpay-backend
          property: url
